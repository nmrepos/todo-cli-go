name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Build
        run: go build ./cmd/server
      - name: Test
        run: go test ./...
      - name: Lint
        run: gofmt -w todo/todo.go cmd/server/main.go todo/todo_test.go && git diff --exit-code
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/todo-app:${{ github.ref_name }} .
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}/todo-app:${{ github.ref_name }}

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev
        run: echo "Deploying dev image"

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to prod
        run: echo "Deploying prod image"
